# Opinion scorecard: opinion scenarios. Owns scores, ordinal/boolean option rows, score
# comparisons, populations.
top: {context_status: status, contract: provenance}
arrays:
  scores:
    roles:
      lens: [net_score, positive_share, negative_share, net_size_of_impact_pp, positive_size_of_impact_pp, negative_size_of_impact_pp]
      column: [scenario_id, scale_id]
      row: [dimensions, grouping_set_id, observation_id]
      status: [coverage_status]
      detail: [positive_mass, negative_mass, positive_options, negative_options, composition_share, impact_population_share, geography_population_base, weighted_denominator, unweighted_base, measure_units]
      provenance: [state, survey_id, scale_version]
      ignored: {group_mask: "internal grain marker; the cut id and subtotal flags carry the same information"}
  rows:
    where: {outcome_domain: [ordinal, boolean]}
    roles:
      lens: [support_share]
      column: [option_id, party_id, outcome_domain, scenario_id]
      row: [dimensions, grouping_set_id, observation_id]
      status: [coverage_status]
      detail: [composition_share, contribution_share, scenario_composition_share, joint_share, size_of_impact_pp, weighted_numerator, weighted_denominator, unweighted_numerator, unweighted_base, population_group_base, population_raw_base, population_total_base, geography_population_base, impact_population_share, impact_unit, impact_weight_basis, unit]
      provenance: [state, survey_id, option_namespace, option_mapping_version, party_namespace, party_mapping_version]
      ignored: {group_mask: "internal grain marker; the cut id and subtotal flags carry the same information"}
  comparisons:
    where: {measure: [net_score, positive_share, negative_share]}
    roles:
      delta: [comparison_id, kind, measure, target, reference, target_value, reference_value, target_share, reference_share, percentage_point_difference, relative_change_pct, size_of_impact_pp, impact_pp]
      row: [dimensions, grouping_set_id]
      status: [coverage_status, impact_status]
      detail: [target_base, reference_base, population_share, population_observation_id, difference_unit]
      ignored: {group_mask: "internal grain marker; the cut id and subtotal flags carry the same information"}
  populations:
    roles:
      row: [dimensions, grouping_set_id, observation_id]
      detail: [composition_share, impact_population_share, population_group_base, population_raw_base, population_total_base, geography_population_base, weight_basis, unit]
      provenance: [state, survey_id]
      ignored: {group_mask: "internal grain marker; the cut id and subtotal flags carry the same information"}
