templates:
  - id: pulse.party_scoreboard
    section: pulse
    title: Party scoreboard
    operation: scoreboard
    questions: [vs_voting_intention]
    measures: [support_share, seats_ac, seats_pc, gender_gap]
    cell: [value, delta, trend]
    density: standard
    requires:
      min_level: state  # seat columns follow capabilities
  - id: pulse.leaders
    section: pulse
    title: Leader satisfaction
    operation: opinion
    questions: [pm_satisfaction, cm_satisfaction, state_govt_satisfaction, central_govt_satisfaction]
    measures: [net_score]
    cell: [value, delta, trend]
    density: compact
    requires:
      min_level: state
  - id: pulse.change_appetite
    section: pulse
    title: Appetite for change
    operation: opinion
    questions: [state_govt_change]
    measures: [positive_share, negative_share, net_score]
    cell: [value, delta, trend]
    density: compact
    requires:
      min_level: state
  - id: pulse.by_zone
    section: pulse
    title: Support by zone
    operation: distribution
    questions: [vs_voting_intention]
    measures: [support_share]
    slices: [party_zone]
    cell: [value, delta, trend]
    density: detailed
    requires:
      min_level: ac
