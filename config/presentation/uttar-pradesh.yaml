rules:
  - field: party_zone
    scope: {state: Uttar Pradesh}
    # Seed order: alphabetical (editable later).
    order:
      - Big Leader Politics Belt
      - Brahmin-Kurmi-Pasi Belt
      - Bundelkhand
      - Devipatan
      - Gorakhpur Division
      - Jat Belt
      - Jat-Lodhi Belt of Brij
      - Kashi-Vindhyachal Belt
      - Kurmi-Bind-Pasi Belt
      - Lucknow-Kanpur Belt
      - Muslim Belt
      - Potato Belt
      - Rohilkhand
      - Urban Belt of Western UP
      - Yadav-Kurmi-Rajbhar Belt

  # Row order for demographic cuts, at every level of a cascaded table. Values not listed follow, A to Z.
  - field: gender
    scope: {state: Uttar Pradesh}
    order: [Male, Female]            # `Other` is hidden by global.yaml

  - field: age_group
    scope: {state: Uttar Pradesh}
    order: ["18-23", "24-35", "36-50", "51-60", "60+"]   # youngest first (labels as the UP surveys carry them)

  - field: category
    scope: {state: Uttar Pradesh}
    order: [GEN, Yadav, NY-OBC, Jatav, NJ-SC/ST, Muslim]
