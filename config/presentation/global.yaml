rules:
  - field: party
    order: [NDA, SP+, BSP, Other, Undecided, NOTA]
    pin_last: [Other, Undecided, NOTA]
    unknown: append_alpha
    # colours: one per canonical party label; none seeded yet (editable later)
  # Universal rule (owner, 2026-11-12): the gender value "Other" is never shown in any table.
  - field: gender
    hidden: [Other]
  # In any category, the grouped-up castes ("Other GEN", "Other NY-OBC", ...) come last under it.
  - field: caste
    pin_last: ["Other *"]
