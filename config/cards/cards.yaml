cards:
  - id: distribution.support_by_caste
    family: distribution
    section: coalitions
    title: Support by caste
    scenarios: [vs_voting_intention]
    cuts: [[], [category], [category, caste], [category, caste, gender]]
    caste_clubbing: true
    requires: {min_level: state}
  - id: opinion.leaders
    family: opinion
    section: leadership
    title: Leader satisfaction
    scenarios: [pm_satisfaction, cm_satisfaction]
    cuts: [[]]
    requires: {min_level: state}
  - id: gender.gap_by_zone
    family: gender_differential
    section: coalitions
    title: Gender gap by zone
    scenarios: [vs_voting_intention]
    cuts: [[], [party_zone]]
    requires: {min_level: ac}
  # Rankings (spec 2026-11-11-ranking-cards-design section 12). party_id is the preset's
  # canonical alliance id; the live check confirms the engine accepts it.
  - id: ranking.ac_pm_net
    family: seat_ranking
    section: rankings
    title: AC ranking, PM net satisfaction
    scenarios: [pm_satisfaction]
    rank: {metric: net_score, level: ac}
    requires: {min_level: ac}
  - id: ranking.ac_bjp_support_by_zone
    family: seat_ranking
    section: rankings
    title: AC ranking, NDA support within each zone
    scenarios: [vs_voting_intention]
    rank: {metric: support_share, party_id: NDA, level: ac, partition_by: [party_zone]}
    requires: {min_level: ac}
  - id: ranking.pc_pm_net
    family: seat_ranking
    section: rankings
    title: PC ranking, PM net satisfaction
    scenarios: [pm_satisfaction]
    rank: {metric: net_score, level: pc}
    requires: {min_level: state}  # PC ranks come from AC or PC surveys; the compiler checks
  - id: ranking.castes_by_ac_support
    family: demographic_ranking
    section: rankings
    title: Top castes by NDA support within each AC
    scenarios: [vs_voting_intention]
    rank: {metric: support_share, party_id: NDA, level: caste, partition_by: [ac_num], top_k: 3}
    requires: {min_level: ac}
  # Benchmarks: the major parties come from the alliance table, the rest is one Other row, and the
  # reference (none, compare round or an election) is chosen on the card. A copy of a card that
  # changes only `view` shows another table of the same cached engine run.
  - id: benchmark.up_zone_nda
    family: seat_benchmark
    section: benchmarks
    title: Seats by zone, NDA against the reference
    scenarios: [vs_voting_intention]
    benchmark: {focal_party: NDA, grouping_sets: [[], [party_zone]]}
    view: {table: comparison}
    requires: {min_level: ac}
  - id: benchmark.up_zone_nda_flips
    family: seat_benchmark
    section: benchmarks
    title: Seat flips by zone, NDA against the reference
    scenarios: [vs_voting_intention]
    benchmark: {focal_party: NDA, grouping_sets: [[], [party_zone]]}
    view: {table: flips}
    requires: {min_level: ac}
  # Relationships: two party questions of one survey row. The matrix shows only the alliance
  # table's major parties; the focal party must be one of them. A copy that changes only `view`
  # shows the other table of the same cached engine run.
  - id: relationship.up_past_to_current
    family: relationship
    section: relationships
    title: Past vote to current choice
    cuts: [[], [gender]]
    relationship: {origin: vs_past, destination: vs_voting_intention, focal_party: NDA}
    view: {table: summary}
  - id: relationship.up_mla_to_current
    family: relationship
    section: relationships
    title: MLA choice to current choice
    cuts: [[], [gender]]
    relationship: {origin: mla_choice_party, destination: vs_voting_intention, focal_party: NDA}
    view: {table: matrix}
